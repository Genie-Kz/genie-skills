</head>
<body>

    <symbol id="vc-icon-file" viewBox="0 0 16 16"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></symbol>
    <symbol id="vc-icon-copy" viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25ZM5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></symbol>
    <symbol id="vc-icon-history" viewBox="0 0 16 16"><path d="m.427 1.927 1.215 1.215a8.002 8.002 0 1 1-1.6 5.685.75.75 0 1 1 1.493-.154 6.5 6.5 0 1 0 1.18-4.458l1.358 1.358A.25.25 0 0 1 3.896 6H.25A.25.25 0 0 1 0 5.75V2.104a.25.25 0 0 1 .427-.177ZM7.75 4a.75.75 0 0 1 .75.75v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5A.75.75 0 0 1 7.75 4Z"/></symbol>
    <symbol id="vc-icon-alert" viewBox="0 0 16 16"><path d="M6.46 1.74a1.75 1.75 0 0 1 3.08 0l6.25 11.5A1.75 1.75 0 0 1 14.25 15H1.75a1.75 1.75 0 0 1-1.54-2.59ZM7.78 2.46l-6.25 11.5a.25.25 0 0 0 .22.37h12.5a.25.25 0 0 0 .22-.37L8.22 2.46a.25.25 0 0 0-.44 0ZM8 5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 5Zm0 7.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></symbol>

    <symbol id="vc-icon-chevron" viewBox="0 0 16 16"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></symbol>
    <symbol id="vc-icon-reply" viewBox="0 0 16 16"><path d="M6.78 1.97a.75.75 0 0 1 0 1.06L3.81 6h6.44A4.75 4.75 0 0 1 15 10.75v2.5a.75.75 0 0 1-1.5 0v-2.5a3.25 3.25 0 0 0-3.25-3.25H3.81l2.97 2.97a.75.75 0 1 1-1.06 1.06L1.47 7.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/></symbol>
    <symbol id="vc-icon-expand" viewBox="0 0 16 16"><path d="M8 2h6v6h-1.5V4.56l-7.22 7.22-1.06-1.06 7.22-7.22H8zM2 4h4v1.5H3.5v7h7V10H12v4H2z"/></symbol>
  </defs></svg>
  <header class="topbar">
    <div class="breadcrumb">
      <svg class="icon" aria-hidden="true"><use href="#vc-icon-file"/></svg><span class="document-name" data-tip="{{TITLE}}">{{TITLE}}</span><span class="slash" aria-hidden="true">/</span>
      <strong id="page-name"></strong><span id="edition"></span>
    </div>
    <div id="edition-update" hidden><span id="available-edition" role="status"></span><button type="button" id="switch-edition">更新</button></div>
    <div class="save-control">
      <button type="button" id="save-now" aria-label="保存" aria-describedby="save-message" aria-keyshortcuts="Control+S Meta+S" data-tip="保存" hidden></button>
      <span id="save-status" tabindex="-1" role="status" aria-atomic="true"><svg class="icon" aria-hidden="true"><use id="status-icon" href="#vc-icon-history"/></svg><span id="save-message">回答を読み込み中</span></span>
    </div>
    <button type="button" id="folder" disabled>保存先を選ぶ</button>
    <div id="fallback-exports"><div id="answer-exports" hidden><button type="button" id="copy" class="icon-btn" disabled aria-label="回答をコピー" data-tip="回答をコピー"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25ZM5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg></button><button type="button" id="download" class="icon-btn" disabled aria-label="JSON で保存" data-tip="JSON で保存"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14ZM7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"/></svg></button></div></div>
    <div class="menu-anchor">
      <button type="button" id="more" class="icon-btn" aria-label="資料と保存のメニュー" aria-haspopup="menu" aria-controls="document-menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#vc-icon-kebab"/></svg></button>
      <div id="document-menu" role="menu" aria-labelledby="more" hidden>
        <div class="menu-heading"><b>{{TITLE}}</b><div id="menu-meta"></div></div>
        <hr role="separator">
        <button type="button" role="menuitem" tabindex="-1" id="menu-save" disabled><svg class="icon" aria-hidden="true"><use href="#vc-icon-save"/></svg>保存</button>
        <button type="button" role="menuitem" tabindex="-1" id="change-folder" disabled><svg class="icon" aria-hidden="true"><use href="#vc-icon-folder"/></svg>保存先を変える<span class="menu-detail" id="menu-folder"></span></button>
        <button type="button" role="menuitem" tabindex="-1" data-copy-path disabled><svg class="icon" aria-hidden="true"><use href="#vc-icon-copy"/></svg>保存先のパスをコピー</button>
        <hr role="separator">
        <div class="menu-status"><svg class="icon" aria-hidden="true"><use id="menu-status-icon" href="#vc-icon-history"/></svg><span id="menu-status">回答を読み込み中</span></div>
      </div>
    </div>
  </header>
  <nav class="rail" aria-label="セクション">
    <div class="nav">
      <div class="nav-group"><span>セクション</span><span class="count" id="progress"></span></div>
      <div id="links"></div>
      <div class="nav-group"><span>追加したセクション</span><button type="button" class="icon-btn" data-new-section aria-label="新しいセクションを追加" data-tip="新しいセクションを追加"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg></button></div>
      <div id="user-links"></div><p class="nav-empty" id="user-empty">まだありません</p>
      <div id="archive-link"></div>
    </div>
    <div class="foot"><a href="#general" data-nav="general"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 13.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H2.75A1.75 1.75 0 0 1 1 10.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h4.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg><span>全体へのコメント</span><span id="request-count">0</span></a><span class="count" id="mobile-progress" hidden></span></div>
    <div class="mobile-nav">
      <select id="sections" aria-label="表示するセクション"></select>
      <button type="button" id="prev-section">前のセクション</button><button type="button" id="next-section">次のセクション</button>
    </div>
  </nav>
  <div class="workspace">
    <main class="main" id="main" tabindex="-1">
      <div id="sheets"></div>
    </main>
    <p role="status" id="notice" hidden></p>
  </div>
  <dialog id="conflict" class="dlg-a" aria-labelledby="conflict-title" aria-describedby="conflict-description">
    <div class="dlg-head">
      <h2 id="conflict-title">どちらの回答を残しますか？</h2>
      <button type="submit" form="conflict-actions" class="dlg-close" aria-label="閉じる"><svg class="icon" aria-hidden="true"><use href="#vc-icon-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <p id="conflict-description" class="dlg-desc"></p>
      <div id="conflict-details" class="conflict-diff"></div>
      <div id="conflict-sources" role="radiogroup" aria-labelledby="conflict-title"></div>
      <p class="conflict-warning">選ばなかった方の回答は消えます。</p>
    </div>
    <form method="dialog" id="conflict-actions" class="dlg-foot">
      <button value="cancel" class="btn btn-quiet">あとで決める</button>
      <button id="conflict-keep" class="btn btn-blue"></button>
    </form>
  </dialog>
  <dialog id="delete-section-dialog" class="dlg-a" aria-labelledby="delete-section-title" aria-describedby="delete-section-description">
    <div class="dlg-head">
      <h2 id="delete-section-title"></h2>
      <button type="submit" form="delete-section-actions" class="dlg-close" aria-label="閉じる"><svg class="icon" aria-hidden="true"><use href="#vc-icon-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <p id="delete-section-description" class="dlg-desc">セクションとそのコメントを削除します。依頼と画像は「全体へのコメント」に残ります。</p>
    </div>
    <form method="dialog" id="delete-section-actions" class="dlg-foot">
      <button value="cancel" class="btn" autofocus>キャンセル</button><button value="delete" class="btn btn-danger">削除</button>
    </form>
  </dialog>
  <dialog id="copy-dialog" class="dlg-a" aria-labelledby="copy-title">
    <div class="dlg-head">
      <h2 id="copy-title">回答をコピー</h2>
      <button type="submit" form="copy-actions" class="dlg-close" aria-label="閉じる"><svg class="icon" aria-hidden="true"><use href="#vc-icon-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <p class="dlg-desc">選択した回答をコピーしてください。</p>
      <textarea id="copy-text" class="copy-area" readonly rows="5" aria-label="コピーする回答"></textarea>
    </div>
    <form method="dialog" id="copy-actions" class="dlg-foot"><button class="btn">閉じる</button></form>
  </dialog>
  <noscript>回答を開くにはブラウザで JavaScript を有効にしてください。</noscript>
  <script type="application/json" id="review-data">{{DATA}}</script>
  <script type="module">
    import { start } from 'review-kit/client';
    await start(reviewDraft => {
      {{DEMO}}
    });
  </script>
</body>
</html>
